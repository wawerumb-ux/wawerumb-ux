<svg xmlns="http://www.w3.org/2000/svg" width="900" height="40" viewBox="0 0 900 40">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00a0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b400ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- Glow line -->
  <line x1="0" y1="20" x2="900" y2="20" stroke="url(#lineGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Marching dashes -->
  <line x1="0" y1="20" x2="900" y2="20"
        stroke="#00f0ff" stroke-width="1" opacity="0.85"
        stroke-dasharray="14 10">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Traveling pulse dot -->
  <circle cy="20" r="3" fill="#ff00a0" filter="url(#glow)">
    <animate attributeName="cx" values="0;900" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="20" r="3" fill="#ff00a0" opacity="0.35">
    <animate attributeName="cx" values="0;900" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;14;3" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0;0.4" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Endpoint markers -->
  <circle cx="12" cy="20" r="2" fill="#b400ff"/>
  <circle cx="888" cy="20" r="2" fill="#b400ff"/>
</svg>